---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI
on:
  pull_request: {}
  push:
    branches: ["main"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    name: Lint / Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go and golangci-lint versions come from mise.toml, which Renovate keeps current.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: golangci-lint run ./...
      - name: go.mod is tidy
        run: go mod tidy -diff
      - run: go test -race ./...
      - name: Known vulnerabilities in code we call
        run: govulncheck ./...
      - name: Workflow security
        run: zizmor --format=github .github/workflows/
        env:
          # Read-only lookups for zizmor's online checks (known-vulnerable or impostor actions).
          GH_TOKEN: ${{ github.token }}

  integration:
    name: Integration
    # Fork PRs get no secrets, so the live mdblist fetch can't run there.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: mise run test:integration
        env:
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}

  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
