---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release
on:
  push:
    branches: ["main"]
concurrency:
  group: release
  cancel-in-progress: false
permissions: {}
jobs:
  release-please:
    name: Release PR / GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # release-please pushes the release commit and tag
      pull-requests: write # release-please opens and labels the Release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # The App token, unlike GITHUB_TOKEN, lets the Release PR trigger CI.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # `--auto` waits for required checks when branch protection is on; the fallback
      # merges immediately when it isn't (the Release PR only bumps the version and
      # CHANGELOG, and the code already passed CI on main).
      - name: Auto-merge the Release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Parsed in the step rather than with fromJSON() here: env expressions are
          # evaluated even for skipped steps, and fromJSON('') is a template error.
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          number="$(jq -r '.number' <<< "$RELEASE_PR")"
          gh pr merge --repo "$GITHUB_REPOSITORY" --squash --auto "$number" \
            || gh pr merge --repo "$GITHUB_REPOSITORY" --squash "$number"
  image:
    name: Build + push image
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout
      packages: write # push the image to ghcr.io
      id-token: write # sign the build provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          IMG="ghcr.io/arsac/mdblistaar"
          echo "tags=${IMG}:${VERSION},${IMG}:${VERSION%.*},${IMG}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ needs.release-please.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          provenance: true
          sbom: true
      # Lets anyone check the image came from this workflow: `gh attestation verify oci://ghcr.io/arsac/mdblistaar:<tag> -R arsac/mdblistaar`.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/arsac/mdblistaar
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
